name: release-please

# GitHub only (Forgejo builds stay untagged). Each push to main updates one "release PR" that bumps package.json and
# prepends the new section to CHANGELOG.md from the conventional commits. Merging it creates the tag (v0.45.0) and the GitHub
# Release; the tag push is what starts publish.yml (image + signed desktop build). Nothing else tags, so nothing double-publishes.
# Needs the repo secret RELEASE_PLEASE_TOKEN (a PAT with contents + pull-requests write): events made with the default
# GITHUB_TOKEN never start other workflows, so without the PAT the tag would not trigger publish.yml.
# To keep plain-English notes on top: as the LAST step before merging, edit CHANGELOG.md on the release PR's branch (add your
# paragraph under the new version heading). Any later push to main regenerates the PR and drops the edit, so edit, then merge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.server_url == 'https://github.com' && github.repository == 'jbowensii/nova-prime-chummer'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
