name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # the server tests run the real importer once (tests/server/books-python.test.ts)
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: importer/requirements.txt }
      - run: pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # the importer tests check their XML against the XSDs with xmllint-wasm
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: importer/requirements.txt }
      - run: pip install -r importer/requirements.txt
      - run: python -m unittest discover -s importer/tests -t .
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chummer-anarchy2 .
      # musl wheels for pdfplumber, pypdfium2 and anthropic: import everything the server spawns
      - run: docker run --rm chummer-anarchy2 python3 -c 'import importer.__main__, importer.ai.propose, importer.ai.providers, pypdfium2'
