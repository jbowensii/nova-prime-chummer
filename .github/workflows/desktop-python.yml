name: desktop-python
# Gate for the Windows desktop bundle: the cp313 lock is current and every importer lib has a Windows wheel.
on:
  pull_request:
    paths:
      - importer/requirements.txt
      - importer/requirements.desktop.lock
      - tools/desktop-python/**
      - .github/workflows/desktop-python.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    if: github.server_url == 'https://github.com' # GitHub-only (windows runner)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.13.9' } # keep equal to $PyVersion in tools/desktop-python/build-python.ps1
      - run: pip install uv
      - name: Lock is current (compile a fresh one if none is committed yet)
        shell: pwsh
        run: |
          # Phase 1 ships no committed desktop lock: compile one for this run so the build can validate wheels.
          # Once importer/requirements.desktop.lock is committed, this gates that it is still fresh.
          if (Test-Path importer/requirements.desktop.lock) {
            Copy-Item importer/requirements.desktop.lock "$env:RUNNER_TEMP/committed.lock"
            ./tools/desktop-python/compile-lock.ps1
            # compare ignoring line endings
            $a = (Get-Content "$env:RUNNER_TEMP/committed.lock") -join "`n"
            $b = (Get-Content importer/requirements.desktop.lock) -join "`n"
            if ($a -ne $b) { throw 'requirements.desktop.lock is stale: rerun tools/desktop-python/compile-lock.ps1 and commit.' }
          } else {
            Write-Host 'No committed desktop lock yet (Phase 1); compiling a fresh one for this run.'
            ./tools/desktop-python/compile-lock.ps1
          }
      # fails if any lib lacks a cp313 win_amd64 wheel or a hash mismatches; prints the zip SHA256 to copy into the script
      - name: Build the bundle
        shell: pwsh
        run: ./tools/desktop-python/build-python.ps1 -Force -AllowUnverified
