name: publish

# Builds and pushes the app image to GHCR as ghcr.io/jbowensii/nova-prime-chummer. No book data ships in the image;
# users bring their own PDFs on the Books page.
# main: only after ci passed on that push (latest + sha-<short>, built from the commit ci checked). A release tag (v*,
# pushed by `gh release create`): as <version>, once its commit is checked to be on main with a ci run there that passed
# (waited for while it's still running: a release made right after the merge).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read # (the tag's check: ci's runs)

jobs:
  publish:
    # a ci run of this repository's own push to main that passed (never a pull request's, which may be a fork's)
    if: >-
      github.repository == 'jbowensii/nova-prime-chummer' && github.server_url == 'https://github.com' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: A release tag's commit is on main and passed ci there
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$status" in identical | behind) ;; *) echo "::error::$GITHUB_REF_NAME ($SHA) isn't on main ($status)"; exit 1 ;; esac
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push"
          for _ in $(seq 80); do
            [ "$(gh api "$runs&status=success" --jq .total_count)" -gt 0 ] && exit 0
            # a run is listed, none passed and none is still to finish: it failed. No run listed yet (a tag pushed right
            # after the merge): keep polling until the timeout
            [ "$(gh api "$runs" --jq '.total_count > 0 and ([.workflow_runs[] | select(.status != "completed")] | length) == 0')" = true ] && break
            sleep 30
          done
          echo "::error::$GITHUB_REF_NAME ($SHA) has no ci run on main that passed"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/jbowensii/nova-prime-chummer
          labels: |
            org.opencontainers.image.description=Character generator and career tracker for Shadowrun: Anarchy 2.0 and Shadowrun Sixth World (SR6)
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') }}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Windows desktop build, attached to the GitHub Release the updater reads. Manual only (run it on a release tag): the
  # signed installers are built and signed locally with SSL.com eSigner (tools/desktop-sign) and uploaded to the release.
  # UNVERIFIED: never run on a real runner. Secrets (set by the owner in the repo settings, referenced only): CSC_LINK (the .pfx,
  # base64 or URL), CSC_KEY_PASSWORD. Nothing here prints them. A tag containing "-" (e.g. v0.21.0-beta.1) must be marked a prerelease.
  desktop:
    if: github.repository == 'jbowensii/nova-prime-chummer' && github.server_url == 'https://github.com' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # electron-builder uploads the assets to the release
    steps:
      - name: The release tag's commit is on main and passed ci there
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$status" in identical | behind) ;; *) echo "::error::$GITHUB_REF_NAME ($SHA) isn't on main ($status)"; exit 1 ;; esac
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push"
          for _ in $(seq 80); do
            [ "$(gh api "$runs&status=success" --jq .total_count)" -gt 0 ] && exit 0
            [ "$(gh api "$runs" --jq '.total_count > 0 and ([.workflow_runs[] | select(.status != "completed")] | length) == 0')" = true ] && break
            sleep 30
          done
          echo "::error::$GITHUB_REF_NAME ($SHA) has no ci run on main that passed"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # unverified in CI: the same script desktop-python.yml runs
      - run: powershell -File tools\desktop-python\build-python.ps1
      - run: npm run build
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
