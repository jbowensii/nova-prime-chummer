name: publish

# Builds and pushes the app image to GHCR as ghcr.io/jbowensii/nova-prime-chummer. No book data ships in the image;
# users bring their own PDFs on the Books page.
# main: only after ci passed on that push (latest + sha-<short>, built from the commit ci checked). A release tag (v*,
# pushed by `gh release create`): as <version>, once its commit is checked to be on main with a ci run there that passed
# (waited for while it's still running: a release made right after the merge).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read # (the tag's check: ci's runs)

jobs:
  publish:
    # a ci run of this repository's own push to main that passed (never a pull request's, which may be a fork's)
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: A release tag's commit is on main and passed ci there
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$status" in identical | behind) ;; *) echo "::error::$GITHUB_REF_NAME ($SHA) isn't on main ($status)"; exit 1 ;; esac
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push"
          for _ in $(seq 80); do
            [ "$(gh api "$runs&status=success" --jq .total_count)" -gt 0 ] && exit 0
            # a run is listed, none passed and none is still to finish: it failed. No run listed yet (a tag pushed right
            # after the merge): keep polling until the timeout
            [ "$(gh api "$runs" --jq '.total_count > 0 and ([.workflow_runs[] | select(.status != "completed")] | length) == 0')" = true ] && break
            sleep 30
          done
          echo "::error::$GITHUB_REF_NAME ($SHA) has no ci run on main that passed"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/jbowensii/nova-prime-chummer
          labels: |
            org.opencontainers.image.description=Character generator and career tracker for Shadowrun: Anarchy 2.0 and Shadowrun Sixth World (SR6)
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') }}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
