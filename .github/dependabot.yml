# Dependabot opens a pull request when a dependency has a security fix or a new version (CI then tests it).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tools: { dependency-type: development }
    ignore:
      # typescript-eslint 8.72 accepts typescript < 6.1; drop this once it supports 6.1+
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
      # types follow the Node 22 runtime (CI, Dockerfile), not the newest Node
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /importer
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
