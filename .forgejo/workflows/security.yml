# Replaces GitHub CodeQL on Forgejo: Semgrep (code) + Trivy (dependencies, secrets, Dockerfile). Report-only for now
# (continue-on-error); make blocking by removing continue-on-error once the baseline is triaged.
name: security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: '23 5 * * 1' }]
  workflow_dispatch:
jobs:
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: pip install --quiet --break-system-packages semgrep
      - run: semgrep scan --config p/default --error --exclude node_modules
        continue-on-error: true # report-only
  trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.58.1/trivy_0.58.1_Linux-64bit.tar.gz | tar -xz -C /usr/local/bin trivy
      - run: trivy fs --scanners vuln,secret,misconfig --skip-dirs node_modules --exit-code 1 .
        continue-on-error: true # report-only
