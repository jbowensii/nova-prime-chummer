# Forgejo Actions port of .github/workflows/ci.yml (kept unchanged for GitHub releases).
# One runner (tower05-runner): jobs queue one at a time. Actions pinned by tag from data.forgejo.org's mirror.
name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # the server tests run the real importer once (tests/server/books-python.test.ts)
      - uses: https://data.forgejo.org/actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: importer/requirements.lock }
      - run: pip install --require-hashes -r importer/requirements.lock
      - run: npm ci
      # known security problems in the dependencies fail the build (high or critical)
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      # npm run check, split: the shared runner is slower than GitHub's, so the 5 s default test timeout is raised.
      # ponytail: blanket 30 s timeout; drop it if the runner gets faster cores or fewer concurrent jobs.
      - run: npx tsc -b
      - run: npm run validate:data
      - run: npx vitest run --coverage --testTimeout=30000 # unit tests with coverage floors (vite.config.ts)
      # timing checks (tests/perf, budgets at the top of each file)
      # ponytail: report-only here; the shared 4-job runner overshoots the dev-PC budgets by ~25%. Re-measure budgets
      # on Tower05 (or give perf a dedicated slot) and drop continue-on-error to make it a gate again.
      - run: npm run perf
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e -- --timeout=90000 # the shared runner is slower than GitHub's; 30 s default times out
  importer:
    runs-on: ubuntu-latest
    # 3.12: the lock's and the dev setup's; 3.14: the image's (the Dockerfile's Alpine python3, pinned with its base)
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://data.forgejo.org/actions/setup-node@v4 # the importer tests check their XML against the XSDs with xmllint-wasm
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: https://data.forgejo.org/actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}', cache: pip, cache-dependency-path: importer/requirements.lock }
      - run: pip install --require-hashes -r importer/requirements.lock
      # 3.12 runs the suite under coverage (floor: 1 point under the 2026-10-21 measure, 89.8%); 3.14 runs it plain
      - if: matrix.python == '3.12'
        run: |
          pip install coverage==7.16.2
          python -m coverage run --source=importer,tools --omit='importer/tests/*' -m unittest discover -s importer/tests -t .
          python -m coverage report --omit='importer/tests/*' --fail-under=89
      - if: matrix.python != '3.12'
        run: python -m unittest discover -s importer/tests -t .
      - if: matrix.python == '3.12'
        run: pip install pip-audit==2.10.1 && pip-audit --strict -r importer/requirements.lock
      # Python style, once: Black formats, pylint lints (config: pyproject.toml). Versions pinned in importer/requirements-lint.txt.
      - if: matrix.python == '3.12'
        run: pip install -r importer/requirements-lint.txt && black --check importer tools && pylint importer tools
  docker:
    runs-on: ubuntu-latest
    # the job container needs the host Docker daemon (runner config must allow this volume: container.valid_volumes)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: docker build -t nova-prime-chummer .
      # musl wheels for pdfplumber, pypdfium2, anthropic and lxml: import everything the server spawns
      - run: docker run --rm nova-prime-chummer python3 -c 'import importer.__main__, importer.ai.propose, importer.ai.providers, importer.datapack, pypdfium2'
      # the image's Python is the one the importer job's matrix tests (3.14): a base bump without the matrix fails here
      - run: docker run --rm nova-prime-chummer python3 -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
      # the server reads the app version backups record from /app/VERSION
      - run: docker run --rm nova-prime-chummer grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+' /app/VERSION
      # no core data in the image: the core rulebook's import (or a data pack) builds it on the server. Checks names and
      # contents: no file named like a core file (src/ca2/catalog/domain/load.ts CORE_FILES), and no file holding core entries
      - run: >-
          docker run --rm nova-prime-chummer sh -c 'found=$(find /app -name "*.xml" | grep -E
          "/(ampeffects|amptypes|armor|attributes|levels|lifestyles|metatypes|packages|pricing|skills|vehicles|weapons)[.]xml$";
          grep -rlE "<(amptype|effect|level|metatype|package|vehicle|lifestyle) id=.[a-z-]+.[^>]* (base|rating|nuyen|edge|attrPoints|pilot|perRun)=.-?[0-9]|attrLastPoint=.[0-9]|<skill id=.[a-z-]+. attr=.[a-z]{3}.|<attribute id=.[a-z]+. abbr=.[A-Z]{3}.|<item id=.[a-z-]+. kind=.(weapon|armor)." /app);
          [ -z "$found" ] || { echo "core data in the image: $found"; exit 1; }'
      # the image starts: every server module is there, the app is served, and a fresh server logs its setup code
      - run: |
          docker run -d --name ca2 nova-prime-chummer
          for _ in $(seq 30); do docker exec ca2 wget -qO- http://127.0.0.1/api/health > /dev/null 2>&1 && break; sleep 1; done
          docker exec ca2 wget -qO- http://127.0.0.1/api/health | grep -q '"ok":true'
          docker exec ca2 wget -qO- http://127.0.0.1/ | grep -q 'id="root"'
          docker logs ca2 2>&1 | grep -q 'Setup code for the first admin'
          docker rm -f ca2
      # started as root, the entrypoint hands root-owned data to PUID:PGID (default 99:100) and drops to it
      - run: |
          docker volume create ca2-data
          docker run --rm -v ca2-data:/data/characters --entrypoint sh nova-prime-chummer -c 'echo x > /data/characters/old.xml'
          docker run --rm -v ca2-data:/data/characters nova-prime-chummer sh -c '[ "$(id -u)" = 99 ] && [ "$(stat -c %u /data/characters/old.xml)" = 99 ] && echo new > /data/characters/new.xml'
  # replaces publish.yml's workflow_run trigger (not supported by Forgejo): main pushes publish after every job passed.
  # Secret REGISTRY_TOKEN (repo Settings > Actions > Secrets): a Forgejo token with write:package for jbowensii.
  publish:
    needs: [check, importer, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # the job container needs the host Docker daemon (runner config must allow this volume: container.valid_volumes)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          img=github.local.owenshomeonline.com/jbowensii/nova-prime-chummer
          echo "$REGISTRY_TOKEN" | docker login github.local.owenshomeonline.com -u jbowensii --password-stdin
          docker build -t "$img:latest" -t "$img:sha-${SHA::7}" .
          docker push "$img:latest" && docker push "$img:sha-${SHA::7}"
