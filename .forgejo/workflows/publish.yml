name: publish

# Forgejo port of .github/workflows/publish.yml. main's :latest is published by ci.yml's publish job (Forgejo has no
# workflow_run). This file handles release tags (v* -> <version>) and manual runs (branch -> :<branch>, main -> :latest).
# ponytail: no "tag is on main and passed ci" gate (GitHub version used gh api); add when releases are cut on Forgejo.
# Windows desktop job dropped: no windows runner. CodeQL dropped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # the job container needs the host Docker daemon (runner config must allow this volume: container.valid_volumes)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
      options: -v /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # release tags (v*) go to the Forgejo registry only: GitHub's own publish.yml puts releases on GHCR
      - env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ github.event_name != 'push' && secrets.GHCR_TOKEN || '' }}
        run: |
          if [ "$EVENT" = push ]; then tag=${REF#v}; elif [ "$REF" = main ]; then tag=latest; else tag=$(echo "$REF" | tr / -); fi
          sh .forgejo/push-image.sh "$tag"
