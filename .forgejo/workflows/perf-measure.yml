# Temporary: measures the perf medians on the Tower05 runner (5 passes, never fails) to set PERF_BUDGET_SCALE.
name: perf-measure
on: workflow_dispatch
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: for i in 1 2 3 4 5; do PERF_BUDGET_SCALE=1000 npm run perf 2>&1 | grep '^perf '; done
