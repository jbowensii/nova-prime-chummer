# Dispatch-only tool: re-measures the perf medians on the Tower05 runner (5 passes, never fails) to set PERF_BUDGET_SCALE.
name: perf-measure
on: workflow_dispatch
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci
      - run: for i in 1 2 3 4 5; do PERF_BUDGET_SCALE=1000 npm run perf 2>&1 | grep '^perf '; done
