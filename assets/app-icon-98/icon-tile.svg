<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a28"/><stop offset="1" stop-color="#090c13"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#222c40" stroke-width="1"/>
  <g filter="url(#glow)">
  <rect x="24" y="10" width="18" height="18" rx="4" fill="none" stroke="#ffb020" stroke-width="2.5"/>
  <rect x="12" y="34" width="18" height="18" rx="4" fill="none" stroke="#19e3ff" stroke-width="2.5"/>
  <rect x="36" y="34" width="18" height="18" rx="4" fill="none" stroke="#ff2d9b" stroke-width="2.5"/>
  <circle cx="33" cy="19" r="2" fill="#ffb020"/>
  <circle cx="21" cy="43" r="2" fill="#19e3ff"/>
  <circle cx="45" cy="43" r="2" fill="#ff2d9b"/>
  </g>
</svg>
